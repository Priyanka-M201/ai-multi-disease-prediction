spring.application.name=disease-prediction-backend
server.port=8080

# In-Memory Database (H2 with MySQL Mode for instant out-of-the-box operation)
spring.datasource.url=jdbc:h2:mem:disease_prediction_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# FastAPI Machine Learning Service Connection
app.ml-service.url=http://127.0.0.1:8000

# JWT Security Configuration
app.jwt.secret=diseasePredictionSecretKeyForJwtAuthenticationMustBeAtLeast512BitsLongAndVerySecure1234567890!
app.jwt.expiration-ms=86400000

# Maximum Multipart Upload Size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

